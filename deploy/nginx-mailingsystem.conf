# Server-Block fuer das Coldmailing-Team-Interface.
# Ziel: /opt/content-intelligence/nginx/conf.d/mailingsystem.conf
# Vorher pruefen: deckt das vorhandene Zertifikat die Subdomain ab?
#   openssl x509 -in /opt/content-intelligence/nginx/ssl/polepositionautomation.de.pem -noout -text | grep -A1 "Subject Alternative Name"
server {
    listen 80;
    server_name mailingsystem.polepositionautomation.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mailingsystem.polepositionautomation.de;

    ssl_certificate     /etc/nginx/ssl/polepositionautomation.de.pem;
    ssl_certificate_key /etc/nginx/ssl/polepositionautomation.de.key;

    location / {
        proxy_pass http://coldmail-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
