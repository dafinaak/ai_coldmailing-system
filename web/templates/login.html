<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden · Poleposition</title>
<link rel="stylesheet" href="{{ url_for('static', path='stil.css') }}">
</head>
<body class="login-hintergrund">
<main class="login-box">
  <div class="marke-zeile">
    <span class="marke-symbol" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </span>
    <span class="marke-name">Poleposition</span>
  </div>
  <h1>Anmelden</h1>
  {% if fehler %}
  <p class="login-fehler">{{ fehler }}</p>
  {% endif %}
  <form method="post" action="/login" class="login-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required autofocus>
    <label for="passwort">Passwort</label>
    <input type="password" id="passwort" name="passwort" required>
    <button type="submit">Anmelden</button>
  </form>
</main>
</body>
</html>
