# DataWarehouse-Postgres fuer Oliver (Phase 3, 08.09.2026).
#
# Der Port haengt AUSDRUECKLICH nur an 127.0.0.1. Auf dem Server wird
# kein Port nach aussen geoeffnet - solange nicht entschieden ist, wie
# Oliver sich verbindet (VPN, SSH-Tunnel, eigener Reverse Proxy), ist
# "von aussen gar nicht erreichbar" der sichere Ausgangspunkt. Wer das
# aendert, aendert eine Sicherheitsentscheidung, nicht eine Kleinigkeit.
#
# Starten:   docker compose -f deploy/docker-compose.postgres.yml up -d
# Stoppen:   docker compose -f deploy/docker-compose.postgres.yml down
# Neu bauen: ... down -v   (loescht das Volume - das Schema wird beim
#            naechsten Start neu eingespielt, weil die Skripte in
#            /docker-entrypoint-initdb.d NUR bei leerem Volume laufen)
#
# Die Zugangsdaten stehen in .env (nicht im Git). Fehlt eines davon,
# startet der Container absichtlich nicht, statt mit einem geratenen
# Passwort hochzukommen.

name: coldmail-dwh

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coldmail}
      POSTGRES_USER: ${POSTGRES_USER:-coldmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      # Von 02-rollen.sh gebraucht, nicht von Postgres selbst.
      COLDMAIL_SYNC_PASSWORD: ${COLDMAIL_SYNC_PASSWORD:?COLDMAIL_SYNC_PASSWORD fehlt in .env}
      COLDMAIL_READ_PASSWORD: ${COLDMAIL_READ_PASSWORD:?COLDMAIL_READ_PASSWORD fehlt in .env}
    ports:
      # 127.0.0.1 ist Absicht. NICHT auf "5433:5432" aendern - das waere
      # auf allen Netzwerkkarten offen.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - coldmail-pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U ${POSTGRES_USER:-coldmail} -d ${POSTGRES_DB:-coldmail}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  coldmail-pgdata:
    name: coldmail-dwh-pgdata
