# Globale Sperrliste - wer hier steht, wird NIE angeschrieben.
#
# Zwei Arten von Einträgen:
#   - domain: nivako.de        -> die ganze Firma (auch "*.beispiel.de")
#   - email:  person@firma.de  -> genau diese eine Adresse
#
# Die Liste wirkt an mehreren Stellen, zuletzt unmittelbar vor dem
# Lead-Import zu Instantly (pipeline/senders/instantly.py). Ein Eintrag
# hier löscht KEINE Daten: Firma, Kontakt und Verlauf bleiben für die
# Nachvollziehbarkeit vollständig erhalten, sie bekommen nur nie wieder
# eine Mail.

